<ion-header>
  <ion-toolbar>
    <ion-title>STUDENT LIST</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <!-- property binding with src -->
  <img class="banner" [src]='banner' alt="banner" />
  <!-- interpolation -->
  <p class="count">Total students: {{ students.length }}</p>
  <!-- used ion row so it can be displayed horizontally -->
  <ion-row>
    <!-- for statement, so yung logic dito is mag loloop sya until wala nang id sa array -->
    @for (s of students; track s.id) {
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ s.name }}</ion-card-title>
        <ion-card-subtitle>Student #{{ s.id }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <!-- ionic chip (color based on gender) -->
        <ion-chip [color]="s.gender === 'Male' ? 'primary' : 'danger'">
          <ion-icon [name]="s.gender === 'Male' ? 'male' : 'female'"></ion-icon>
          <ion-label>{{ s.gender }}</ion-label>
        </ion-chip>
        <!-- if else statement | for showing student details at ung close button -->
        @if (selected?.id !== s.id) {
        <!-- event binding using ion button -->
        <ion-button size="small" (click)="select(s)">See Details</ion-button>
        } @else {
        <div class="detail">
          <p>{{ s.course }}</p>
          <p>Year {{ s.year }}</p>
        </div>
        <ion-button size="small" color="danger" (click)="close()">Close</ion-button>
        }
      </ion-card-content>
    </ion-card>
    }
  </ion-row>

</ion-content>
